# Vigilancia diaria de main (sin IA y sin secretos propios): si alguien debilita una defensa, si el SGSI apunta a
# controles que ya no existen o si aparece una vulnerabilidad conocida en una dependencia fijada, el trabajo falla y
# GitHub le avisa al dueño por correo. Son los controles CT15 y CT37 del SGSI (sgsi/README.md).
name: vigilancia-diaria

on:
  schedule:
    - cron: "37 11 * * *"   # cada día a las 6:37 a. m., hora de Colombia
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vigilar:
    # macOS: la caja de arena usa sandbox-exec, que solo existe ahí (lección L42)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, fijada al commit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, fijada al commit
        with:
          python-version: "3.13"
      - name: Instalar solo lo de requirements.txt, verificando la huella de cada paquete
        run: pip install --require-hashes -r requirements.txt
      - name: Vulnerabilidades conocidas en las dependencias fijadas (OSV, sin llaves)
        run: python herramientas/vulnerabilidades.py
      - name: SGSI con la efectividad de cada control (blindaje, baterías, corrida sintética, mutantes y comprobaciones con red)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # solo para no chocar con el límite de la API pública; permiso de lectura
        run: python herramientas/sgsi.py --efectividad --en-linea
